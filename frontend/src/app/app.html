<div class="min-h-screen bg-slate-50 flex flex-col font-sans">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">H</div>
      <h1 class="text-xl font-bold text-gray-800">Hanmaum Admin</h1>
    </div>

    <div>
      @if (userProfile()) {
        <div class="flex items-center gap-4">
          <div class="text-right hidden sm:block">
            <div class="text-sm font-semibold text-gray-900">
              {{ userProfile().name || userProfile().preferred_username }}
            </div>
            <div class="text-xs text-gray-500">Administrator</div>
          </div>

          <p-button
            label="Logout"
            icon="pi pi-sign-out"
            severity="secondary"
            [outlined]="true"
            size="small"
            (onClick)="logout()" />
        </div>
      }
      @else {
        <p-button label="Login" icon="pi pi-user" (onClick)="login()" />
      }
    </div>
  </header>

  <main class="flex-grow p-6">

    <router-outlet></router-outlet>

    @if (userProfile()) {
      <div class="mt-10 p-4 bg-gray-100 rounded border border-gray-300 text-xs font-mono overflow-auto max-h-60">
        <p class="font-bold text-gray-500 mb-2">🔧 DEBUG: Keycloak Token Claims</p>
        <pre>{{ userProfile() | json }}</pre>
      </div>
    }

  </main>

</div>
