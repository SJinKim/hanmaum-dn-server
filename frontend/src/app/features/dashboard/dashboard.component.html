<div class="min-h-screen bg-slate-50 flex flex-col">

  <p-toolbar styleClass="border-none rounded-none shadow-md bg-white px-6 py-3">

    <ng-template pTemplate="start">
      <div class="flex items-center gap-2">
        <i class="pi pi-box text-blue-600 text-2xl"></i>
        <span class="font-bold text-xl text-slate-800 tracking-tight">Hanmaum Admin</span>
      </div>
    </ng-template>

    <ng-template pTemplate="end">
      <div class="flex items-center gap-4">

        <div class="hidden md:block text-right">
          <div class="text-sm font-bold text-slate-700">{{ userName() }}</div>
          <div class="text-xs text-slate-400">Administrator</div>
        </div>

        <p-avatar
          icon="pi pi-user"
          styleClass="bg-blue-100 text-blue-600 cursor-pointer"
          shape="circle"
          (click)="userMenu.toggle($event)">
        </p-avatar>

        <p-menu #userMenu [model]="menuItems" [popup]="true" />
      </div>
    </ng-template>
  </p-toolbar>

  <main class="flex-grow p-6">
    <div class="max-w-7xl mx-auto">

      <div class="card bg-white p-8 rounded-xl shadow-sm border border-slate-100">
        <h2 class="text-2xl font-bold mb-4">Willkommen im Dashboard</h2>
        <p class="text-gray-600">
          Du bist erfolgreich eingeloggt. Hier entsteht deine Kirchen-Verwaltung.
        </p>

        <div class="mt-8 flex gap-4">
          <p-button label="Mitglieder verwalten" icon="pi pi-users" />
          <p-button label="Gruppen" severity="secondary" icon="pi pi-comments" />
        </div>
      </div>

    </div>
  </main>

</div>
