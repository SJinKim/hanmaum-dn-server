# Staging (System Test) stack — shares the Hetzner server with prod.
# Caddy is managed separately via docker-compose.caddy.yml.
# Keycloak is shared with prod (auth.graceops.de) — staging uses its own realm.
# Container names use -staging suffix to avoid conflicts with the prod stack.
# Tighter resource limits so staging cannot starve prod.
#
# Required env vars (.env.staging on the server):
#   DB_HANMAUM_DN_NAME, DB_HANMAUM_DN_USER, DB_HANMAUM_DN_SECRET
#   DB_HANMAUM_DN_URL              — e.g. jdbc:postgresql://hanmaumApp-db-staging:5432
#   KEYCLOAK_REALM                 — staging realm name, e.g. hanmaum-st
#   KEYCLOAK_BACKEND_CLIENT_ID     — backend service account client ID
#   KEYCLOAK_BACKEND_CLIENT_SECRET — backend service account client secret
#   BACKEND_IMAGE_STAGING          — set by CI: ghcr.io/sjinkim/hanmaum-dn-server:sha-<short>
#   STAGING_API_DOMAIN             — public staging API hostname, e.g. api.staging.graceops.de
#   APP_SECURITY_KEYCLOAK_PUBLIC_ISSUER — https://auth.graceops.de/realms/<staging-realm>
# Server-local monitoring credentials (never commit these files):
#   ./secrets/staging-postgres-exporter-user
#   ./secrets/staging-postgres-exporter-password
#
# Usage:
#   docker compose --project-name hanmaum-staging \
#     --env-file .env.staging \
#     -f docker-compose.staging.yml up -d
#
# SSH tunnel access from a workstation:
#   ssh -L 5435:127.0.0.1:5435 <server>
#   psql -h localhost -p 5435 -U <DB_HANMAUM_DN_USER> -d <DB_HANMAUM_DN_NAME>

x-log-rotation: &log-rotation
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  hanmaumApp-db-staging:
    image: postgres:16-alpine
    container_name: hanmaumApp-db-staging
    restart: always
    environment:
      POSTGRES_DB: ${DB_HANMAUM_DN_NAME}
      POSTGRES_USER: ${DB_HANMAUM_DN_USER}
      POSTGRES_PASSWORD: ${DB_HANMAUM_DN_SECRET}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - staging-internal

  postgres-exporter-staging:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    container_name: hanmaum-postgres-exporter-staging
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "hanmaumApp-db-staging:5432/${DB_HANMAUM_DN_NAME}?sslmode=disable"
      DATA_SOURCE_USER_FILE: /run/secrets/postgres-exporter-user
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres-exporter-password
    volumes:
      - ./secrets/staging-postgres-exporter-user:/run/secrets/postgres-exporter-user:ro
      - ./secrets/staging-postgres-exporter-password:/run/secrets/postgres-exporter-password:ro
    labels:
      observability.logs.enabled: "true"
      observability.service: postgres-exporter
      observability.environment: staging
    depends_on:
      hanmaumApp-db-staging:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - staging-internal
      - observability
    logging: *log-rotation

  backend-staging:
    image: ${BACKEND_IMAGE_STAGING:-ghcr.io/sjinkim/hanmaum-dn-server:staging}
    container_name: hanmaumApp-backend-staging
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SPRING_DATASOURCE_URL: ${DB_HANMAUM_DN_URL}/${DB_HANMAUM_DN_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_HANMAUM_DN_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_HANMAUM_DN_SECRET}
      SPRING_FLYWAY_ENABLED: "true"
      PII_KEYRING_PATH: /run/secrets/hanmaum-pii-keyring.properties
      # Keycloak is shared with prod — staging uses its own realm on the same instance.
      # hanmaumApp-keycloak is reachable via the caddy-proxy network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://hanmaumApp-keycloak:8090/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      KEYCLOAK_AUTH_SERVER_URL: http://hanmaumApp-keycloak:8090
      # Public Keycloak URL placed in JWT iss claim — must match token issuer exactly.
      APP_SECURITY_KEYCLOAK_PUBLIC_ISSUER: ${APP_SECURITY_KEYCLOAK_PUBLIC_ISSUER}
    env_file:
      - path: .env.staging
        required: false
    labels:
      observability.logs.enabled: "true"
      observability.service: dn-server
      observability.environment: staging
    volumes:
      - ${PII_KEYRING_FILE:-./secrets/staging-pii-keyring.properties}:/run/secrets/hanmaum-pii-keyring.properties:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      hanmaumApp-db-staging:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - staging-internal
      - caddy-proxy
      - observability
    logging: *log-rotation

networks:
  staging-internal:
    driver: bridge
  caddy-proxy:
    external: true
  observability:
    external: true

volumes:
  postgres_data_staging:
