services:
  # Deine existierende Datenbank
  hanmaumApp-db:
    image: postgres:15-alpine
    container_name: hanmaumApp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_HANMAUM_DN_NAME}
      POSTGRES_USER: ${DB_HANMAUM_DN_USER}
      POSTGRES_PASSWORD: ${DB_HANMAUM_DN_SECRET}
    ports:
      - "5433:5432"
    volumes:
      - hanmaumApp_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # test db
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DN_TEST_NAME}
      POSTGRES_USER: ${DB_DN_TEST_USER}
      POSTGRES_PASSWORD: ${DB_DN_TEST_SECRET}
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # --- NEU: KEYCLOAK (Der Identity Provider) ---
  hanmaumApp-keycloak:
    image: quay.io/keycloak/keycloak:26.3.0
    container_name: hanmaumApp-keycloak
    depends_on:
      hanmaumApp-db:
        condition: service_healthy
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      # --- Postgres Verbindung ---
      KC_DB: postgres
      KC_DB_URL: ${DB_HANMAUM_DN_URL}/${KEYCLOAK_POSTGRES_DB}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_SECRET}

      KC_DB_URL_PROPERTIES: "?currentSchema=public"

      KC_HTTP_PORT: '8090'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_CACHE: 'local'
      KC_HEALTH_ENABLED: "true"
    ports:
      - '8091:8090'
      - '9001:9000'
    env_file:
      - .env
    volumes:
      - ./docker/keycloak/data:/opt/keycloak/data
        # Hier muss deine realm-export.json liegen, damit --import-realm sie findet
      - ./docker/keycloak/export:/opt/keycloak/data/import

  # -----------------------------------------------------------------
  # BACKEND APP (Später für den Server)
  # -----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hanmaumApp-backend
    restart: unless-stopped
    ports:
      - "8080:8080" # App ist von außen erreichbar
    environment:
      # WICHTIG: Hier nutzen wir den internen Docker-Namen und Port der DB
      SPRING_DATASOURCE_URL: ${DB_HANMAUM_DN_URL}/${DB_HANMAUM_DN_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_HANMAUM_DN_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_HANMAUM_DN_SECRET}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_SERVER_URL_DOCKER}/realms/${KC_HANMAUM_REALM}
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_SERVER_URL_DOCKER}

    env_file:
      - .env
    depends_on:
      hanmaumApp-db:
        condition: service_healthy
      hanmaumApp-keycloak:
        condition: service_started

volumes:
  hanmaumApp_postgres_data: