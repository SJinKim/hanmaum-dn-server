name: Deploy — Production

# Manual trigger only. main is NEVER auto-deployed on push.
#
# Required GitHub secrets:
#   SERVER_HOST      — IP or hostname of the Hetzner server
#   SERVER_USER      — SSH user (e.g. root, ubuntu)
#   SSH_PRIVATE_KEY  — Ed25519 private key (no passphrase)
#   GHCR_TOKEN       — PAT with read:packages scope (for docker pull on server)
#
# One-time server setup (no git clone needed — CI pushes all files):
#   mkdir -p /opt/hanmaum-dn-server
#   # Shared edge is installed separately from the graceops-edge repository.
#   # Create /opt/hanmaum-dn-server/.env and .env.staging with real values
#
# Go to Settings → Environments → production and add required reviewers
# to enforce an approval gate before any deploy runs.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a running prod deploy

env:
  IMAGE: ghcr.io/sjinkim/hanmaum-dn-server
  DEPLOY_DIR: /opt/hanmaum-dn-server

jobs:
  # ── Guard ────────────────────────────────────────────────────────────────────
  guard:
    name: Verify branch is main
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Reject non-main deploys
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys must be triggered from main (got: ${{ github.ref }})"
          exit 1

  # ── Build & push image ───────────────────────────────────────────────────────
  build:
    name: Build image
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # The 'production' GitHub Environment enforces required reviewers before
  # this job starts. Configure approvers at:
  #   Settings → Environments → production → Required reviewers
  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Push infrastructure files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,docker-compose.staging.yml,infrastructure"
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BACKEND_IMAGE: ${{ env.IMAGE }}:sha-${{ needs.build.outputs.sha_short }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,BACKEND_IMAGE
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u sjinkim --password-stdin

            # Application deploys consume the shared edge contract but never
            # create, recreate, or reload Caddy.
            docker network inspect caddy-proxy > /dev/null
            docker inspect --format='{{.State.Running}}' hanmaum-caddy | grep -q true
            EDGE_OWNER=$(docker inspect --format='{{index .Config.Labels "graceops.edge.owner"}}' hanmaum-caddy)
            test -z "$EDGE_OWNER" -o "$EDGE_OWNER" = "graceops-edge" \
              || { echo "Unexpected shared edge owner: $EDGE_OWNER"; exit 1; }
            docker network create observability 2>/dev/null || true

            cd /opt/hanmaum-dn-server

            # Offsite backup is prepared 1-2 weeks before real production launch.
            # It remains optional during pre-production development, then becomes
            # a hard deploy gate through REQUIRE_OFFSITE_BACKUP=true in .env.
            set -a && source .env && set +a
            if [ "${REQUIRE_OFFSITE_BACKUP:-false}" = "true" ]; then
              test -f .env.backup \
                || { echo "Missing .env.backup. Complete PRODUCTION_READINESS.md."; exit 1; }
              set -a && source .env.backup && set +a
              test "${BACKUP_ENABLED:-false}" = "true" \
                || { echo "Offsite backup is required but disabled."; exit 1; }
              ./infrastructure/backup/backup.sh
            else
              echo "::warning::Offsite backup gate is not active. Complete PRODUCTION_READINESS.md 1-2 weeks before launch."
            fi

            # Deploy prod stack
            export BACKEND_IMAGE
            docker compose --project-name hanmaum-prod -f docker-compose.prod.yml pull backend
            docker compose --project-name hanmaum-prod -f docker-compose.prod.yml up -d --no-build --remove-orphans

            # Remove images older than 7 days
            docker image prune -f --filter "until=168h"

            # Internal health check — validates Spring Boot started correctly
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' hanmaumApp-backend 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "Backend is healthy"
                break
              fi
              echo "  attempt $i/12: $STATUS"
              sleep 10
            done
            docker inspect --format='{{.State.Health.Status}}' hanmaumApp-backend | grep -q 'healthy' \
              || { echo "Backend health check failed"; exit 1; }

            # External smoke test — validates Caddy routing + TLS end-to-end
            set -a && source .env && set +a
            for i in $(seq 1 6); do
              if curl -fsS "https://${API_DOMAIN}/actuator/health" > /dev/null 2>&1; then
                echo "External smoke test passed: https://${API_DOMAIN}/actuator/health"
                break
              fi
              echo "  waiting for external routing... ($i/6)"
              sleep 10
            done
            curl -fsS "https://${API_DOMAIN}/actuator/health" \
              || { echo "External smoke test failed"; exit 1; }

            echo "Deployed $BACKEND_IMAGE to production"
