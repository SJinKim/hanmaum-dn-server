name: Deploy — Production

# Manual trigger only. main is NEVER auto-deployed on push.
#
# Required GitHub secrets (Environment: production):
#   SERVER_HOST      — IP or hostname of the production server
#   SERVER_USER      — SSH user (e.g. deploy, ubuntu)
#   SERVER_SSH_KEY   — Ed25519 private key (no passphrase)
#   GHCR_TOKEN       — PAT with read:packages scope (for docker pull on server)
#
# One-time server setup:
#   mkdir -p /opt/hanmaum-dn-server
#   git clone https://github.com/SJinKim/hanmaum-dn-server.git /opt/hanmaum-dn-server
#   cp /opt/hanmaum-dn-server/.env.example /opt/hanmaum-dn-server/.env  # fill in real values
#
# Go to Settings → Environments → production and add required reviewers
# to enforce an approval gate before any deploy runs.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a running prod deploy

env:
  IMAGE: ghcr.io/sjinkim/hanmaum-dn-server

jobs:
  # ── Guard ────────────────────────────────────────────────────────────────────
  # Production deploys must originate from main.
  guard:
    name: Verify branch is main
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Reject non-main deploys
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys must be triggered from main (got: ${{ github.ref }})"
          exit 1

  # ── Build & push image ───────────────────────────────────────────────────────
  build:
    name: Build image
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # :latest is a convenience alias; the sha tag is what gets deployed
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # The 'production' GitHub Environment enforces required reviewers before
  # this job starts. Configure approvers at:
  #   Settings → Environments → production → Required reviewers
  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BACKEND_IMAGE: ${{ env.IMAGE }}:sha-${{ needs.build.outputs.sha_short }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,BACKEND_IMAGE
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u sjinkim --password-stdin

            cd /opt/hanmaum-dn-server
            git pull --ff-only origin main

            export BACKEND_IMAGE
            docker compose --project-name hanmaum-prod -f docker-compose.prod.yml pull backend
            docker compose --project-name hanmaum-prod -f docker-compose.prod.yml up -d --no-build --remove-orphans

            # Remove images older than 7 days
            docker image prune -f --filter "until=168h"

            echo "Deployed $BACKEND_IMAGE to production"
