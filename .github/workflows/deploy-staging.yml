name: Deploy — Staging

# Triggers: automatic on push to dev, or manual dispatch from any ref.
#
# Required GitHub secrets (Environment: staging):
#   SERVER_HOST      — same Hetzner server as production
#   SERVER_USER      — SSH user (e.g. root, ubuntu)
#   SSH_PRIVATE_KEY  — Ed25519 private key (no passphrase)
#   GHCR_TOKEN       — PAT with read:packages scope (for docker pull on server)
#
# One-time server setup (no git clone needed — CI pushes all files):
#   mkdir -p /opt/hanmaum-dn-server
#   docker network create caddy-proxy
#   # Create /opt/hanmaum-dn-server/.env.staging with real values
#   # Create the postgres-exporter credential files documented in README.md

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sjinkim/hanmaum-dn-server
  DEPLOY_DIR: /opt/hanmaum-dn-server

jobs:
  # ── Tests ───────────────────────────────────────────────────────────────────
  # dev branch has no separate CI workflow, so we gate here.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hanmaum
          POSTGRES_PASSWORD: hanmaum
          POSTGRES_DB: hanmaum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate staging Compose
        run: >-
          docker compose
          --project-name hanmaum-staging
          -f docker-compose.staging.yml
          config -q
        env:
          DB_HANMAUM_DN_NAME: hanmaum_staging
          DB_HANMAUM_DN_USER: app
          DB_HANMAUM_DN_SECRET: ci-placeholder
          DB_HANMAUM_DN_URL: jdbc:postgresql://hanmaumApp-db-staging:5432
          KEYCLOAK_REALM: hanmaum-st
          KEYCLOAK_BACKEND_CLIENT_ID: dn-backend-admin
          KEYCLOAK_BACKEND_CLIENT_SECRET: ci-placeholder
          STAGING_API_DOMAIN: api.staging.example.com
          APP_SECURITY_KEYCLOAK_PUBLIC_ISSUER: https://auth.example.com/realms/hanmaum-st

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hanmaum_test
          SPRING_DATASOURCE_USERNAME: hanmaum
          SPRING_DATASOURCE_PASSWORD: hanmaum

  # ── Build & push image ───────────────────────────────────────────────────────
  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Push infrastructure files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.staging.yml,docker-compose.caddy.yml,infrastructure"
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BACKEND_IMAGE_STAGING: ${{ env.IMAGE }}:sha-${{ needs.build.outputs.sha_short }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,BACKEND_IMAGE_STAGING
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u sjinkim --password-stdin

            # Ensure the shared proxy network exists (idempotent)
            docker network create caddy-proxy 2>/dev/null || true
            docker network create observability 2>/dev/null || true

            cd /opt/hanmaum-dn-server

            # Refresh shared Caddy as staging may be the first deployment after
            # an infrastructure route change.
            mkdir -p /opt/hanmaum-service-observability/caddy/generated
            docker compose \
              --env-file .env \
              --env-file .env.staging \
              --project-name hanmaum-caddy \
              -f docker-compose.caddy.yml \
              up -d
            docker exec hanmaum-caddy \
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

            # Deploy staging stack
            export BACKEND_IMAGE_STAGING
            test -f secrets/staging-postgres-exporter-user \
              || { echo "Missing staging postgres_exporter username file"; exit 1; }
            test -f secrets/staging-postgres-exporter-password \
              || { echo "Missing staging postgres_exporter password file"; exit 1; }
            docker compose \
              --project-name hanmaum-staging \
              --env-file .env.staging \
              -f docker-compose.staging.yml \
              pull backend-staging postgres-exporter-staging
            docker compose \
              --project-name hanmaum-staging \
              --env-file .env.staging \
              -f docker-compose.staging.yml \
              up -d --no-build --remove-orphans

            docker inspect --format='{{.State.Running}}' hanmaum-postgres-exporter-staging \
              | grep -q true \
              || { echo "Staging postgres_exporter is not running"; exit 1; }

            # Remove images older than 7 days
            docker image prune -f --filter "until=168h"

            # Internal health check — validates Spring Boot started correctly
            echo "Waiting for staging backend to become healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' hanmaumApp-backend-staging 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "Staging backend is healthy"
                break
              fi
              echo "  attempt $i/12: $STATUS"
              sleep 10
            done
            docker inspect --format='{{.State.Health.Status}}' hanmaumApp-backend-staging | grep -q 'healthy' \
              || { echo "Staging backend health check failed"; exit 1; }

            docker exec hanmaumApp-backend-staging \
              curl -fsS http://hanmaum-postgres-exporter-staging:9187/metrics \
              | grep -Eq '^pg_up 1(\.0)?$' \
              || { echo "Staging postgres_exporter cannot monitor PostgreSQL"; exit 1; }

            # External smoke test — validates Caddy routing + TLS end-to-end
            set -a && source .env.staging && set +a
            for i in $(seq 1 6); do
              if curl -fsS "https://${STAGING_API_DOMAIN}/actuator/health" > /dev/null 2>&1; then
                echo "External smoke test passed: https://${STAGING_API_DOMAIN}/actuator/health"
                break
              fi
              echo "  waiting for external routing... ($i/6)"
              sleep 10
            done
            curl -fsS "https://${STAGING_API_DOMAIN}/actuator/health" \
              || { echo "External smoke test failed"; exit 1; }

            echo "Deployed $BACKEND_IMAGE_STAGING to staging"
