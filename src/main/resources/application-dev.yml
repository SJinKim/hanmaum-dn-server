# === LOKALE ENTWICKLUNG (DEV) ===
spring:
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seed

  datasource:
    # Verbindet sich mit deinem lokalen Docker (Port 5433)
    url: jdbc:postgresql://localhost:5433/${DB_HANMAUM_DN_NAME}
    username: ${DB_HANMAUM_DN_USER}
    password: ${DB_HANMAUM_DN_SECRET}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true # Sehr wichtig für lokales Debugging!
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8091/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

app:
  security:
    # [AI-GUARD] Never hardcode realm names here. ${KEYCLOAK_REALM} is read from .env.
    # Changing these values will break login for other developers or on staging.
    # To use a different realm locally, set KEYCLOAK_REALM in your .env file.
    allowed-issuers:
      - "http://localhost:8091/realms/${KEYCLOAK_REALM}"
      - "http://10.0.2.2:8091/realms/${KEYCLOAK_REALM}"
      - "http://hanmaumApp-keycloak:8090/realms/${KEYCLOAK_REALM}"
  keycloak:
    server-url_docker: ${KEYCLOAK_SERVER_URL_DOCKER}
    realm: ${KEYCLOAK_REALM}
    admin-client-id: ${KEYCLOAK_BACKEND_CLIENT_ID}
    admin-client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET}