server:
  port: 8080

api:
  prefix: /api/v1

spring:
  application:
    name: hanmaum-dn-server
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  profiles:
    active: dev

app:
  cors:
    allowed-origins: "http://localhost:4200,http://localhost"
  cleanup:
    cron: "0 0 2 * * *"
    retention-days: 30