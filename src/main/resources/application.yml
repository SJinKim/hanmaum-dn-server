server:
  port: 8080

api:
  prefix: /api/v1

spring:
  application:
    name: hanmaum-dn-server
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  profiles:
    active: dev

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

hanmaum:
  church:
    location:
      # Leonhard-Heißwolf-Straße 5, 65936 Frankfurt am Main.
      # The one congregation this deployment serves, so it is the default rather than
      # something every host has to repeat. Clearing the variables does NOT disable the
      # geofence — the defaults below still apply — so a deployment without one sets
      # enabled to false. Overriding the coordinates is all-or-nothing: two of three is
      # rejected at startup.
      enabled: ${HANMAUM_CHURCH_LOCATION_ENABLED:true}
      latitude: ${HANMAUM_CHURCH_LOCATION_LATITUDE:50.1281518}
      longitude: ${HANMAUM_CHURCH_LOCATION_LONGITUDE:8.5843494}
      radius-meters: ${HANMAUM_CHURCH_LOCATION_RADIUS_METERS:100}
  bible-api:
    # The congregation's bible API, which backs both verse cards on Home.
    #
    # The credentials belong here and never in the app binary: a static bearer secret is
    # extractable from an APK or IPA, and rotating it would break every installed client at
    # once. That is the reason this proxy exists.
    #
    # They default to blank so a deployment — and every test — boots without them. An
    # unconfigured deployment answers 503 on the verse endpoints rather than pretending the
    # reading plan is empty.
    base-url: ${QT_API_BASE_URL:https://bible.asher.design/api/v1}
    reader-base-url: ${QT_READER_BASE_URL:https://bible.asher.design}
    key-id: ${QT_API_KEY_ID:}
    secret: ${QT_SECRET:}
    # 92 is 개역개정, the upstream default and what the Home card shows.
    default-translation-id: ${QT_DEFAULT_TRANSLATION_ID:92}
  rsvp:
    reminder-offsets: ${HANMAUM_RSVP_REMINDEROFFSETS:P7D}

app:
  pii:
    strict: ${PII_STRICT:false}
    local-plaintext-enabled: ${PII_LOCAL_PLAINTEXT_ENABLED:false}
    keyring-path: ${PII_KEYRING_PATH:}
    active-key-id: ${PII_ACTIVE_KEY_ID:v1}
    encryption-key: ${PII_ENCRYPTION_KEY:}
    index-key: ${PII_INDEX_KEY:}
    legacy-plaintext-read-enabled: ${PII_LEGACY_PLAINTEXT_READ_ENABLED:true}
    backfill-enabled: ${PII_BACKFILL_ENABLED:true}
    backfill-batch-size: ${PII_BACKFILL_BATCH_SIZE:200}
    max-in-memory-members: ${PII_MAX_IN_MEMORY_MEMBERS:5000}
  cors:
    allowed-origins: "http://localhost:4200,http://localhost"
  cleanup:
    cron: "0 0 2 * * *"
    retention-days: 30
  member-retention:
    days: ${MEMBER_RETENTION_DAYS:30}
