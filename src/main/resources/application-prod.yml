# === PRODUKTION (LIVE SERVER) ===
spring:
  jpa:
    show-sql: false # SQL ausblenden (spart extrem viel Server-Leistung!)
    hibernate:
      ddl-auto: validate # Auf Prod darf Hibernate NIEMALS Tabellen ändern!

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

logging:
  level:
    root: INFO

app:
  security:
    # Comma-separated — @Value List<String> requires a scalar, not a YAML list.
    # [AI-GUARD] One issuer per environment, set via APP_SECURITY_KEYCLOAK_PUBLIC_ISSUER.
    # This must match the public `iss` claim Keycloak puts in the JWT exactly.
    # Staging: https://auth.graceops.de/realms/hanmaum-dn-st
    # Prod:    https://auth.graceops.de/realms/hanmaum
    # Never hardcode. Each environment sets its own env var.
    allowed-issuers: "${APP_SECURITY_KEYCLOAK_PUBLIC_ISSUER}"
  pii:
    strict: ${PII_STRICT:true}
    local-plaintext-enabled: false
    keyring-path: ${PII_KEYRING_PATH:/run/secrets/hanmaum-pii-keyring.properties}
    legacy-plaintext-read-enabled: ${PII_LEGACY_PLAINTEXT_READ_ENABLED:true}
    backfill-enabled: ${PII_BACKFILL_ENABLED:true}
    backfill-batch-size: ${PII_BACKFILL_BATCH_SIZE:200}
    max-in-memory-members: ${PII_MAX_IN_MEMORY_MEMBERS:5000}
  cors:
    allowed-origins: "https://dn-admin-dashboard.graceops.de,https://dn-admin-dashboard.st.graceops.de"
  keycloak:
    server-url_docker: ${KEYCLOAK_AUTH_SERVER_URL:http://hanmaumApp-keycloak:8090}
    realm: ${KEYCLOAK_REALM}
    admin-client-id: ${KEYCLOAK_BACKEND_CLIENT_ID}
    admin-client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
