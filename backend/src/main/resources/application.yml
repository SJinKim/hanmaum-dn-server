spring:
  application:
    name: church-dn-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8091/realms/hanmaum

  # 1. Datenbank Verbindung
  datasource:
    url: jdbc:postgresql://localhost:5433/dn_youth_hanmaum_db
    username: user1
    password: user1password
    driver-class-name: org.postgresql.Driver

  # 2. JPA / Hibernate Einstellungen
  jpa:
    database: POSTGRESQL
    show-sql: true      # Zeigt dir im Log, was Hibernate tut (Gut zum Debuggen)
    open-in-view: false
    hibernate:
      # WICHTIG: 'validate' prüft nur, ob DB und Kotlin zusammenpassen.
      # Da wir die Tabellen manuell erstellt haben, darf Hibernate NICHTS ändern!
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Dialekt für Postgres 15+
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 3. Flyway (DB Migration Tool)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

# Server Port (Standard ist 8080)
server:
  port: 8080