# Production stack — Hetzner server.
# Caddy is managed separately via docker-compose.caddy.yml.
# Only hanmaumApp-backend and hanmaumApp-keycloak join caddy-proxy so Caddy can
# reach them. The database stays on the internal network only.
#
# Required env vars (.env on the server):
#   DB_HANMAUM_DN_NAME, DB_HANMAUM_DN_USER, DB_HANMAUM_DN_SECRET
#   DB_HANMAUM_DN_URL              — e.g. jdbc:postgresql://hanmaumApp-db:5432
#   KEYCLOAK_ADMIN_USER, KEYCLOAK_ADMIN_PASSWORD, KEYCLOAK_REALM
#   BACKEND_IMAGE                  — set by CI: ghcr.io/sjinkim/hanmaum-dn-server:sha-<short>
#   API_DOMAIN, AUTH_DOMAIN        — public hostnames (used by Caddy, sourced from .env)
#
# Usage:
#   make prod-up    →  docker compose --project-name hanmaum-prod -f docker-compose.prod.yml up -d
#   make prod-down  →  docker compose --project-name hanmaum-prod -f docker-compose.prod.yml down
#
# SSH tunnel access from a workstation:
#   ssh -L 5433:127.0.0.1:5433 <server>
#   psql -h localhost -p 5433 -U <DB_HANMAUM_DN_USER> -d <DB_HANMAUM_DN_NAME>

services:
  hanmaumApp-db:
    image: postgres:16-alpine
    container_name: hanmaumApp-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_HANMAUM_DN_NAME}
      POSTGRES_USER: ${DB_HANMAUM_DN_USER}
      POSTGRES_PASSWORD: ${DB_HANMAUM_DN_SECRET}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - prod-internal

  hanmaumApp-keycloak:
    image: quay.io/keycloak/keycloak:26.3.0
    container_name: hanmaumApp-keycloak
    restart: unless-stopped
    command: start --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${DB_HANMAUM_DN_URL}/hanmaum_keycloak_db
      KC_DB_USERNAME: ${DB_HANMAUM_DN_USER}
      KC_DB_PASSWORD: ${DB_HANMAUM_DN_SECRET}
      KC_DB_URL_PROPERTIES: "?currentSchema=public"
      KC_HTTP_PORT: "8090"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: "local"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infrastructure/docker/keycloak/export:/opt/keycloak/data/import
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      hanmaumApp-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - prod-internal
      - caddy-proxy

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/sjinkim/hanmaum-dn-server:latest}
    container_name: hanmaumApp-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SPRING_DATASOURCE_URL: ${DB_HANMAUM_DN_URL}/${DB_HANMAUM_DN_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_HANMAUM_DN_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_HANMAUM_DN_SECRET}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://hanmaumApp-keycloak:8090/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      KEYCLOAK_AUTH_SERVER_URL: http://hanmaumApp-keycloak:8090
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      hanmaumApp-db:
        condition: service_healthy
      hanmaumApp-keycloak:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - prod-internal
      - caddy-proxy

networks:
  prod-internal:
    driver: bridge
  caddy-proxy:
    external: true

volumes:
  postgres_data:
